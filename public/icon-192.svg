<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stopColor="#0d47a1" />
      <stop offset="60%" stopColor="#1e3a8a" />
      <stop offset="100%" stopColor="#0a0f1d" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stopColor="#fef08a" />
      <stop offset="50%" stopColor="#eab308" />
      <stop offset="100%" stopColor="#b45309" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Sfondo Reale Savoia con angoli arrotondati -->
  <rect width="192" height="192" rx="42" fill="url(#bgGrad)" />
  <rect x="6" y="6" width="180" height="180" rx="36" fill="none" stroke="url(#goldGrad)" stroke-width="3" opacity="0.6" />

  <!-- Profilo stilizzato della Mole Antonelliana sullo sfondo -->
  <polygon points="96,22 108,60 84,60" fill="#ffb703" opacity="0.25" />
  <rect x="88" y="60" width="16" height="35" fill="#ffb703" opacity="0.2" />

  <!-- Toro Rampante Sabaudo Dorato (Simbolo di Torino) -->
  <g filter="url(#glow)">
    <!-- Corpo del Toro -->
    <path d="M72,118 Q80,95 96,90 Q112,88 126,102 Q134,110 138,124 Q130,132 118,128 Q104,136 88,132 Z" fill="url(#goldGrad)" />
    <!-- Zampe anteriori rampanti -->
    <path d="M120,98 L136,82 L144,88 L132,106 Z" fill="url(#goldGrad)" />
    <path d="M112,104 L126,72 L134,75 L124,108 Z" fill="url(#goldGrad)" />
    <!-- Zampe posteriori possenti -->
    <path d="M78,124 L62,142 L68,146 L86,130 Z" fill="url(#goldGrad)" />
    <path d="M88,128 L82,148 L90,150 L98,132 Z" fill="url(#goldGrad)" />
    <!-- Testa e Corna aguzze -->
    <circle cx="132" cy="76" r="11" fill="url(#goldGrad)" />
    <!-- Corna dorate -->
    <path d="M130,70 Q134,50 148,46 Q144,58 136,68 Z" fill="#ffffff" />
    <path d="M126,72 Q122,54 114,50 Q122,60 128,70 Z" fill="#fde047" />
    <!-- Occhio fiero -->
    <circle cx="134" cy="74" r="2" fill="#0f172a" />
    <!-- Coda sferzante -->
    <path d="M72,122 Q54,118 48,100 Q54,106 68,114 Z" fill="url(#goldGrad)" />
  </g>

  <!-- Corona Reale in alto -->
  <polygon points="86,40 91,48 96,38 101,48 106,40 104,52 88,52" fill="url(#goldGrad)" />

  <!-- Scritta Arcade SUPER TURIN -->
  <rect x="22" y="152" width="148" height="24" rx="6" fill="#0a0f1d" stroke="#eab308" stroke-width="1.5" />
  <text x="96" y="168" font-family="monospace, sans-serif" font-weight="900" font-size="11" fill="#fef08a" text-anchor="middle" letter-spacing="2">SUPER TURIN</text>
</svg>

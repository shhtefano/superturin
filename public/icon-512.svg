<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad512" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stopColor="#0d47a1" />
      <stop offset="55%" stopColor="#1e3a8a" />
      <stop offset="100%" stopColor="#0a0f1d" />
    </linearGradient>
    <linearGradient id="goldGrad512" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stopColor="#fef08a" />
      <stop offset="50%" stopColor="#eab308" />
      <stop offset="100%" stopColor="#b45309" />
    </linearGradient>
    <filter id="glow512" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Sfondo Reale Savoia con angoli arrotondati -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad512)" />
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="url(#goldGrad512)" stroke-width="8" opacity="0.6" />

  <!-- Profilo stilizzato della Mole Antonelliana sullo sfondo -->
  <polygon points="256,60 288,160 224,160" fill="#ffb703" opacity="0.25" />
  <rect x="236" y="160" width="40" height="90" fill="#ffb703" opacity="0.2" />

  <!-- Toro Rampante Sabaudo Dorato (Simbolo di Torino) -->
  <g filter="url(#glow512)" transform="scale(2.6) translate(-28, -20)">
    <!-- Corpo del Toro -->
    <path d="M72,118 Q80,95 96,90 Q112,88 126,102 Q134,110 138,124 Q130,132 118,128 Q104,136 88,132 Z" fill="url(#goldGrad512)" />
    <!-- Zampe anteriori rampanti -->
    <path d="M120,98 L136,82 L144,88 L132,106 Z" fill="url(#goldGrad512)" />
    <path d="M112,104 L126,72 L134,75 L124,108 Z" fill="url(#goldGrad512)" />
    <!-- Zampe posteriori possenti -->
    <path d="M78,124 L62,142 L68,146 L86,130 Z" fill="url(#goldGrad512)" />
    <path d="M88,128 L82,148 L90,150 L98,132 Z" fill="url(#goldGrad512)" />
    <!-- Testa e Corna aguzze -->
    <circle cx="132" cy="76" r="11" fill="url(#goldGrad512)" />
    <!-- Corna dorate -->
    <path d="M130,70 Q134,50 148,46 Q144,58 136,68 Z" fill="#ffffff" />
    <path d="M126,72 Q122,54 114,50 Q122,60 128,70 Z" fill="#fde047" />
    <!-- Occhio fiero -->
    <circle cx="134" cy="74" r="2" fill="#0f172a" />
    <!-- Coda sferzante -->
    <path d="M72,122 Q54,118 48,100 Q54,106 68,114 Z" fill="url(#goldGrad512)" />
  </g>

  <!-- Corona Reale in alto -->
  <polygon points="230,105 242,126 256,100 270,126 282,105 278,135 234,135" fill="url(#goldGrad512)" />

  <!-- Targa Arcade SUPER TURIN -->
  <rect x="64" y="408" width="384" height="60" rx="14" fill="#0a0f1d" stroke="#eab308" stroke-width="4" />
  <text x="256" y="449" font-family="monospace, sans-serif" font-weight="900" font-size="28" fill="#fef08a" text-anchor="middle" letter-spacing="4">SUPER TURIN</text>
</svg>
